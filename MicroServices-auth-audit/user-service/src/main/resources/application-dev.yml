server:
  port: 8083 # port d ecoute pour auth service

spring:
  application:
    name: user-service
  security:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
            ddl-auto: ${DB_DDL_AUTO}
    show:
      sql: true
      properties:
          hibernate:
              format_sql: true
